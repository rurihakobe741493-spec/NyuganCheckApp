# 乳がんについて
- id: disease-survival
  category: disease
  question: 乳がんは治る病気ですか？
  body: |
    早い段階で見つかった乳がんは、治療によって長く生きられる可能性が高い病気です。

    国立がん研究センターの集計では、診断から10年後に生存している人の割合は、
    ステージⅠで93.7%、Ⅱで85.4%、Ⅲで63.8%、Ⅳで17.0%でした
    （がん以外の死因の影響を統計的に除いた値）。
    早く見つかるほど数字が大きく変わることが分かります。

    ただしこれは多くの人をまとめた統計であり、一人ひとりの見通しを示すものではありません。
    また、この数字は2012年に診断された方を10年間追跡したものです。
    その後も治療法は進歩しているため、現在はこれより良い成績が期待できます。

    気になる症状があるときは、次の検診を待たずに医療機関を受診してください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「院内がん登録生存率集計」（2012年診断例・2025年3月公表／2026年8月12日参照）

- id: disease-incidence
  category: disease
  question: 乳がんはどのくらいの人がかかる病気ですか？
  body: |
    2023年に乳がんと診断された人は全国で103,424例、うち女性が102,592例でした。
    女性がかかるがんの中で最も多く、決してめずらしい病気ではありません。

    一方、2024年に乳がんで亡くなった女性は15,869人でした。
    診断される人の数と比べると、亡くなる人の数はかなり少なくなっています。

    かかる人が多いということは、それだけ検査や治療の方法が確立しているということでもあります。
    まずは定期的に検診を受けることから始めてください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「がん統計：乳房」（罹患2023年・死亡2024年／2026年8月12日参照）

- id: disease-age
  category: disease
  question: 何歳くらいから注意が必要ですか？
  body: |
    乳がんにかかる人は30歳代後半から増え始め、40歳以上の女性では最も多いがんになります。

    自治体が行う乳がん検診が40歳からとされているのは、この年齢分布に基づくものです。
    40歳になったら、2年に1度の検診を続けてください。

    ただし、若ければ乳がんにならないというわけではありません。
    年齢にかかわらず、しこりなど気になる症状があるときは、
    検診ではなく医療機関を受診してください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

# 検診について
- id: screening-purpose
  category: screening
  question: 乳がん検診は何のために受けるのですか？
  body: |
    症状が出る前の乳がんを見つけて、乳がんで亡くなることを防ぐためです。

    早い段階の乳がんは、自覚症状がないことが少なくありません。
    症状が出てから見つかるがんは進行していることが多く、治療の負担も大きくなりがちです。
    検診は「気になるところがない人」が受けるもの、と考えてください。

    逆に、しこり、乳房のひきつれ、乳首から血の混じった液が出る、乳首のただれなど、
    すでに気になる症状がある場合は、検診ではなく医療機関を受診してください。
    検診で「異常なし」と判定されると、症状の原因が分からないまま確認が遅れてしまいます。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: screening-age
  category: screening
  question: 何歳から、どのくらいの間隔で受ければいいですか？
  body: |
    国が勧めているのは、40歳から2年に1度、マンモグラフィによる検診です。

    「毎年受けたほうが安心では」と思われるかもしれません。
    けれども検診には、利益（乳がんで亡くなるのを防ぐ）だけでなく、
    不利益（見逃し、がんではないのに精密検査になること、
    治療しなくてよいがんを見つけてしまうことなど）もあります。
    この両方の釣り合いから、40歳・2年に1度という基準が決められています。

    まずはこの年齢と間隔を守って、続けて受けることが大切です。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: screening-types
  category: screening
  question: 自治体の検診と人間ドックは何が違いますか？
  body: |
    目的が違います。

    お住まいの市区町村が行う検診は「対策型検診」と呼ばれ、
    住民全体の乳がん死亡を減らすことを目的としています。
    公費が使われるため自己負担は無料か少額で、
    効果が科学的に確かめられた方法だけが採用されています。

    人間ドックなどは「任意型検診」と呼ばれ、個人が自分の判断で受けるものです。
    費用は原則として自己負担で、施設によって検査の内容が異なります。
    国が勧めていない検査項目が含まれていることもあります。

    どちらを選んでも構いませんが、
    まずはお住まいの市区町村の検診案内を確認してみてください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「がん検診について」（2026年8月12日参照）

- id: screening-limits
  category: screening
  question: 検診を受けていれば安心ですか？
  body: |
    検診で100%見つかるわけではありません。

    がんが小さすぎたり、見つけにくい位置や形をしていたりすると、
    検査を受けても写らないことがあります。これを「偽陰性」といいます。
    また、検診と次の検診の間に新しく乳がんができることもあります。

    だからこそ、検診は1回受けて終わりではなく、続けて受けることが大切です。
    そして、ふだんから自分の乳房の状態に関心を持ち、
    いつもと違うと感じたら、次の検診を待たずに医療機関を受診してください。

    「去年の検診で異常なしだったから大丈夫」という自己判断が、いちばん危険です。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: screening-recall
  category: screening
  question: 「要精密検査」と言われたら何をするのですか？
  body: |
    検診の画像に気になるところがあったとき、
    それが何なのかをはっきりさせるために、より詳しい検査を行います。
    一般的には、次のような検査を必要に応じて組み合わせます。

    マンモグラフィの追加撮影
    気になる部分を狙って、拡大したり角度を変えたりして撮り直します。
    検診と同じように圧迫しますが、範囲は狭くなります。

    超音波（エコー）検査
    気になる部分を含めて、その場で動かしながら詳しく観察します。
    痛みはほとんどありません。

    細胞診・組織診
    画像だけで判断がつかないとき、細い針を刺して細胞や組織を採り、顕微鏡で調べます。

    結果を待つ間は不安なものですが、
    「症状がないから大丈夫」「次の検診まで待とう」と自己判断しないでください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: screening-recall-rate
  category: screening
  question: 「要精密検査」はがんということですか？
  body: |
    いいえ。「がんかどうかを確かめる必要がある」という意味であり、
    がんと診断されたわけではありません。

    実際、精密検査が必要と判定された人のうち乳がんが見つかるのは、20人に1人ほどです。
    残りの方は「がんではなかった」という結果を受け取ることになります。

    検診は、少しでも気になるところがあれば見逃さないように判定します。
    そのため、がんではない人も精密検査の対象になります。
    「要精密検査」と言われるのは、そういう仕組みによるものです。

    確率としては低くても、確かめないままでは分かりません。
    通知が届いたら、なるべく早く精密検査を受けてください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「がん検診について（医療関係者向け）」乳がん検診の陽性反応適中度 約4.6%（2026年8月12日参照)

# マンモグラフィ
- id: mammography-what
  category: mammography
  question: マンモグラフィはどんな検査ですか？
  body: |
    乳房専用のX線検査です。片方ずつ、透明な板で乳房を挟んで平らにし、撮影します。

    挟むのは、痛い思いをさせるためではありません。
    乳房を薄く伸ばすと、重なっていた乳腺が広がって内部が見やすくなり、
    少ない放射線量で鮮明な画像が得られます。
    厚みのあるまま撮ると、しこりが乳腺の陰に隠れてしまいます。

    片側につき2方向（上下方向と斜め方向）を撮るのが一般的です。
    マンモグラフィが得意なのは、しこりになる前の「石灰化」を見つけることです。
    ごく小さなカルシウムの粒で、超音波や触診では捉えられません。
    早期の乳がんが石灰化として見つかることは少なくありません。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: mammography-pain
  category: mammography
  question: マンモグラフィは痛いですか？
  body: |
    感じ方には個人差がありますが、乳房を圧迫している間に痛みを感じる方が多いです。

    ただし、圧迫している時間は1回あたり数十秒ほどです。
    ずっと挟まれ続けるわけではなく、撮影が終わればすぐに解放されます。

    月経前は乳房が張って痛みを強く感じやすいため、
    月経開始から1週間ほど経った時期に予約すると、比較的楽に受けられます。

    痛みが強いときは、我慢せずその場で担当者に伝えてください。
    体の向きや力の抜き方を調整することで軽くなる場合があります。
    また、肩や腕に力が入っていると痛みが増すので、
    深く息を吐いて力を抜くことを意識してみてください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: mammography-radiation
  category: mammography
  question: 被ばくは心配ないですか？
  body: |
    定められた年齢と間隔（40歳から2年に1度）で受ける限り、
    放射線による健康への影響はほとんど心配ありません。

    1回の撮影で乳房が受ける放射線量は0.05〜0.15ミリシーベルト程度です。
    一方、私たちが日常生活で自然に受けている放射線は1年あたり約2.4ミリシーベルトとされています。

    放射線を使う検査である以上、量はゼロではありません。
    それでも「受けないことで乳がんの発見が遅れる不利益」のほうがはるかに大きい、
    という判断のもとに検診が勧められています。

    妊娠中または妊娠の可能性がある場合は、必ず事前にお申し出ください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: mammography-dense
  category: mammography
  question: 「高濃度乳房」と言われました。どういう意味ですか？
  body: |
    乳房に占める乳腺の割合が多い状態のことで、病気ではありません。
    生まれつきの体質や年齢、ホルモンの状態で決まる、乳房のタイプのひとつです。
    日本人には比較的多く、若い方や閉経前の方に多く見られます。

    ただし、検査の見え方には影響します。
    マンモグラフィでは乳腺が白く写りますが、乳がんも白く写ります。
    乳腺が多いと画像全体が白っぽくなり、
    その中に隠れた病変が見つけにくくなることがあります。

    とはいえ、マンモグラフィが無意味になるわけではありません。
    早期発見の手がかりになる石灰化は、乳腺が多くてもはっきり写ります。

    「超音波も追加したほうがいいのか」と考える方は多いと思います。
    超音波を組み合わせるとがんの発見率が上がることは研究で示されていますが、
    それによって乳がんで亡くなる人が減るかどうかはまだ確かめられていません。
    そのため現時点で、国の検診に超音波は組み込まれていません。

    高濃度乳房と言われた方にとって大切なのは、
    定期的な検診を続けること、そしてふだんから自分の乳房の状態に関心を持ち、
    いつもと違うと感じたら医療機関を受診することです。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）
    - 認定NPO法人 乳房健康研究会「高濃度乳房について」（J-START の結果／2026年8月12日参照）

- id: mammography-clothing
  category: mammography
  question: 当日はどんな服装で行けばいいですか？
  body: |
    上半身は脱いでいただくため、上下が分かれた服が便利です。
    ワンピースだと全部脱ぐことになるので、避けたほうが楽でしょう。
    検査着に着替える施設が多く、その場合は服装をあまり気にする必要はありません。

    もうひとつ、意外に大事なのが「上半身に何も塗っていかない」ことです。
    制汗剤（特にパウダー入りのもの）、ボディパウダー、ラメ入りのクリームなどは、
    石灰化とよく似た白い点として画像に写ってしまうことがあります。
    当日の朝は、胸から脇にかけて何も使わずに来てください。

    ネックレスなどのアクセサリーは外します。
    はじめから着けずに行くほうが手間が省けます。
  updated_on: "2026-08-12"

- id: mammography-duration
  category: mammography
  question: どのくらい時間がかかりますか？
  body: |
    撮影そのものは、着替えを含めても10分程度で終わることがほとんどです。
    圧迫している時間は1回あたり数十秒、これを片側2方向ずつ行います。

    ただし、受付から会計までの全体では、混み具合によって
    30分から1時間ほど見ておくと安心です。
    集団検診や検診車の場合は、待ち時間がさらに長くなることがあります。

    結果は当日には出ません。
    複数の医師が画像を読影するため、通知が届くまでには
    数週間かかるのが一般的です（期間は施設や自治体によって異なります）。
  updated_on: "2026-08-12"

- id: mammography-notice
  category: mammography
  question: 検査の前に伝えておくべきことはありますか？
  body: |
    次に当てはまる場合は、予約のときか受付で必ずお知らせください。
    検査ができるかどうか、どう撮影するかの判断に関わります。

    妊娠中、または妊娠の可能性がある
    放射線を使う検査のため、原則として時期を改めていただきます。

    ペースメーカーなど、胸のあたりに医療機器が埋め込まれている
    圧迫によって機器を傷めるおそれがあるため、検診での撮影は原則として行いません。
    かかりつけの医療機関にご相談ください。

    豊胸手術（シリコンの挿入など）を受けたことがある
    撮影ができないわけではありませんが、
    正確な判定が難しくなる場合があるため、事前にお伝えください。

    授乳中である、または最近まで授乳していた
    乳腺が発達していて画像が読み取りにくくなることがあります。

    そのほか、乳房の手術を受けたことがある、しこりなど気になる症状がある、
    といった場合も遠慮なくお伝えください。
    黙っていて良いことは何もありません。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

# 乳腺エコー(超音波検査)
- id: ultrasound-what
  category: ultrasound
  question: 乳腺エコー（超音波）はどんな検査ですか？
  body: |
    超音波を使って乳房の内部を観察する検査です。

    プローブという器具にゼリーを塗り、乳房に密着させて超音波を当てます。
    跳ね返ってきた超音波を画像に変換し、
    検査する人がプローブを動かしながら、その場でリアルタイムに確認していきます。

    仰向けに寝た状態で、片側ずつ調べます。
    マンモグラフィのように乳房を挟むことはありません。

    放射線を使わないため、妊娠中の方や若い方でも受けられます。
    しこりが見つかったとき、その中身が液体なのか、
    かたまりなのかを見分けることも得意です。
  updated_on: "2026-08-12"

- id: ultrasound-pain
  category: ultrasound
  question: 超音波検査は痛くありませんか？
  body: |
    ほとんど痛みはありません。

    乳房を圧迫しないので、マンモグラフィのような痛みとは無縁です。
    プローブを押し当てる感触はありますが、
    肌の上を滑らせていく程度のものです。

    塗るゼリーがひんやりすることがありますが、
    温めて使う施設も多く、気になるほどではないと思います。

    検査時間は10分から15分ほどが目安です。
    寝ているだけで終わりますので、身構える必要はありません。
  updated_on: "2026-08-12"

- id: ultrasound-vs-mammography
  category: ultrasound
  question: マンモグラフィと超音波、どちらを受ければいいですか？
  body: |
    どちらかを選ぶ、というものではありません。得意なことが違う検査です。

    マンモグラフィは、しこりになる前の小さな石灰化を見つけるのが得意です。
    乳房全体を一定の方法で撮影するため、
    前回の画像と見比べて変化を捉えることもできます。

    超音波は、しこりの有無や、その中身を詳しく調べるのが得意です。
    乳腺が多い乳房でも、しこりを捉えやすいという特徴があります。

    そのうえで、国が検診として勧めているのはマンモグラフィです。
    超音波については、乳がんで亡くなる人を減らす効果が
    まだ確かめられていないためです。

    まずは40歳から2年に1度のマンモグラフィ検診を続けてください。
    超音波を追加で受けたい場合や、
    気になる症状があって詳しく調べたい場合は、
    乳腺を専門とする医療機関でご相談ください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: ultrasound-limits
  category: ultrasound
  question: 超音波だけ受けていれば十分ですか？
  body: |
    超音波にも苦手なことがあるため、それだけで十分とは言えません。

    最も大きいのは、細かい石灰化を見つけにくいことです。
    ごく初期の乳がんが石灰化としてだけ現れる場合、
    超音波では捉えられないことがあります。ここはマンモグラフィが得意な領域です。

    また、超音波はその場で見ながら進める検査のため、
    どこをどう観察したかが検査する人によって変わりやすく、
    前回と同じ条件で比べることが難しいという面もあります。

    「痛くないから超音波だけでいい」と考えたくなる気持ちは自然なものですが、
    2つの検査は補い合う関係にあります。
    まずは国が勧めるマンモグラフィ検診を土台にしてください。
  updated_on: "2026-08-12"

# 視触診・セルフチェック
- id: palpation-selfcheck-value
  category: palpation
  question: セルフチェックだけでは不十分ですか？
  body: |
    自分で触ることには意味がありますが、検診の代わりにはなりません。
    役割が違うと考えてください。

    自分で触って分かるしこりは、ある程度の大きさになってからのものです。
    マンモグラフィが得意とする石灰化は、触れて分かるものではありません。
    つまり「触って何もない」ことは、乳がんがないことの証明にはなりません。

    一方で、検診にも限界があります。2年に1度の検診の合間に見つかる乳がんもあります。
    ここで力を発揮するのが、ふだんから自分の乳房に関心を持っていることです。

    近年すすめられているのは「ブレスト・アウェアネス」という考え方です。
    しこりを探して自分で診察するのではなく、
    自分の乳房のいつもの状態を知っておき、変化に気づけるようにしておく。
    そういう生活習慣を指します。

    検診とブレスト・アウェアネス、どちらか一方ではなく両方を続けてください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: palpation-awareness
  category: palpation
  question: ブレスト・アウェアネスとは何ですか？
  body: |
    「乳房を意識する生活習慣」のことです。次の4つが基本とされています。

    1．自分の乳房の状態を知っておく
    入浴や着替えのときなど、日常のちょっとした機会に、見て、触れて、感じてみる。
    大きさやかたさ、月経周期にともなう変化など、
    「自分にとってのふつう」を知っておくことが出発点です。

    2．変化に気づく
    しこり、皮膚のひきつれやくぼみ、乳首から血の混じった液が出る、
    乳首のただれなど、これまでになかった変化に気をつけます。

    3．変化に気づいたら、すぐ医師に相談する
    次の検診を待たず、乳腺外来のある医療機関を受診してください。

    4．定期的に乳がん検診を受ける
    自覚症状がなくても、40歳になったら2年に1度。

    大切なのは、異常を探して不安になることではありません。
    自分の体を知っておく、ただそれだけのことです。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「乳がん検診について」（2026年8月12日参照）

- id: palpation-lump
  category: palpation
  question: しこりがあれば乳がんですか？
  body: |
    しこりがあっても、乳がんではないことのほうが多いです。

    乳房には、乳腺症や線維腺腫、のう胞など、
    がんではない変化がよく見られます。
    月経周期にともなって張りやしこりのように感じることもあります。

    ただし、自分で触った感触だけで見分けることはできません。
    やわらかいから大丈夫、動くから大丈夫、痛くないから大丈夫、
    といった判断はどれも当てになりません。

    確かめる方法は、医療機関で調べてもらうことだけです。
    このとき受診するのは検診ではなく、乳腺を専門とする医療機関です。
    症状があるまま検診を受けても、
    「異常なし」と判定されて原因が分からないままになることがあります。
  updated_on: "2026-08-12"

- id: palpation-when
  category: palpation
  question: いつ自分で触るのがいいですか？
  body: |
    月経のある方は、月経が終わって数日後がおすすめです。
    この時期は乳房の張りが引いていて、ふだんの状態を確認しやすくなります。

    月経前は乳腺が張り、しこりのように感じることがあります。
    この時期に触って不安になり、月経後には気にならなくなる、というのはよくあることです。

    月経のない方は、毎月同じ日と決めておくと続けやすいでしょう。

    ただし、時期にこだわりすぎる必要はありません。
    入浴や着替えのついでで構いません。
    大切なのは、続けることと、変化に気づいたら受診することです。
  updated_on: "2026-08-12"

# その他
- id: other-family-history
  category: other
  question: 家族に乳がんの人がいます。どうすればいいですか？
  body: |
    まずは、乳がんの多くは遺伝によるものではない、ということを知っておいてください。
    遺伝的な体質が関係しているのは、乳がん全体の5%ほどとされています。

    そのうえで、家族に乳がんの方がいる場合、
    そうでない方に比べてリスクがやや高くなることは知られています。
    40歳を待たずに、乳腺を専門とする医療機関で一度相談しておくのもひとつの方法です。

    次のような特徴が家族や自分に当てはまる場合は、
    「遺伝性乳がん卵巣がん症候群（HBOC）」という体質が関係している可能性があります。

    ・若いうちに乳がんになった血縁者がいる
    ・血縁者に乳がんの人が複数いる
    ・左右両方の乳房に乳がんができた人がいる
    ・卵巣がん、膵臓がん、前立腺がんになった血縁者がいる
    ・男性で乳がんになった血縁者がいる

    こうした場合、遺伝カウンセリングという相談の窓口があります。
    検査を受けるかどうかも含めて、専門家と一緒に考えていく場です。
    受けなければならないものではありません。

    当てはまるかどうかにかかわらず、
    定期的な検診とふだんの気づきを続けることが基本です。
  updated_on: "2026-08-12"
  sources:
    - 日本遺伝性乳癌卵巣癌総合診療制度機構（JOHBOC）「遺伝性乳癌卵巣癌（HBOC）の概要」（2026年8月12日参照）

- id: other-male
  category: other
  question: 男性も乳がんになりますか？
  body: |
    なります。数は多くありませんが、実際に起きています。

    2023年に乳がんと診断された男性は、全国で832例でした。
    女性の102,592例と比べると1%にも満たない数ですが、
    ゼロではないということが大切です。

    男性は乳がん検診の対象になっていません。
    そのぶん発見が遅れやすく、
    「男性だから関係ない」という思い込みが受診を遅らせることがあります。

    胸のあたりにしこりを触れる、乳首から分泌物が出る、
    乳首がへこんだりただれたりしている。
    こうした変化に気づいたときは、乳腺を専門とする医療機関を受診してください。
  updated_on: "2026-08-12"
  sources:
    - 国立がん研究センター がん情報サービス「がん統計：乳房」（罹患2023年／2026年8月12日参照）

- id: other-cost
  category: other
  question: 検診にはいくらかかりますか？
  body: |
    お住まいの市区町村によって異なります。

    自治体の乳がん検診は公費でまかなわれているため、
    無料の場合もあれば、千円台の自己負担がある場合もあります。
    年齢によって無料クーポンが配られる自治体もあります。

    人間ドックなどで受ける場合は原則として自己負担となり、
    金額は施設によって幅があります。

    正確な金額は、「お住まいの市区町村名」と「乳がん検診」を組み合わせて検索するか、
    市区町村の担当窓口に問い合わせるのが確実です。
    受診券や案内が郵送されている場合もあるので、
    届いていないか確認してみてください。
  updated_on: "2026-08-12"

- id: other-result-timing
  category: other
  question: 検診の結果はいつ届きますか？
  body: |
    その場では分かりません。数週間かかるのが一般的です。

    マンモグラフィの画像は、複数の医師がそれぞれ読影して判定します。
    その結果をまとめて通知するため、どうしても日数がかかります。
    正確な期間は施設や自治体によって異なるので、
    受診したときに確認しておくと安心です。

    待っている間は落ち着かないものですが、
    連絡がないこと自体を心配しすぎる必要はありません。

    ただし、待っている間に気になる変化に気づいた場合は別です。
    結果を待たずに医療機関を受診してください。
  updated_on: "2026-08-12"


